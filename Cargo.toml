[package]
name = "wlrec"
version = "0.1.0"
edition = "2024"
description = "A CLI window recorder for Wayland"
repository = "https://github.com/ymgyt/wlrec"

[dependencies]
anyhow = "1"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gstreamer = "0.25"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"
